<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎂 ¡Feliz cumpleaños!</title>
<meta property="og:title" content="🎂 Tengo algo para ti">
<meta property="og:description" content="Ábrelo, es una sorpresa.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,700&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="balloons" id="balloons" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="stage" id="stage">
  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="pocket"></div>
    <div class="flap"></div>
    <button class="seal" id="abrir" type="button">Ábreme</button>
  </div>

  <article class="card" id="card">
    <figure class="photo" id="photo">
      <span class="tape"></span>
      <img id="/img/hermanos.jpeg" alt="Foto de cumpleaños">
      <span class="no-foto">🎂</span>
    </figure>
    <h1 id="titulo"></h1>
    <p class="msg" id="mensaje"></p>
    <p class="firma" id="firma"></p>
    <p class="hint">Toca la carta para más confeti</p>
  </article>
</main>
<script src="script.js"></script>
</body>
</html>
